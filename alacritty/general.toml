#Version 0.2.0
[window]
startup_mode = "Fullscreen"
padding = { x = 5,  y = 2 }
dynamic_padding = true
decorations = "none"
opacity = 0.99
decorations_theme_variant = "Dark"
[env]
TERM = "xterm-256color"

[mouse]
hide_when_typing = true

[font]
size = 11

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[cursor]
style = { shape = "Block", blinking = "On" }

[scrolling]
history = 10000
multiplier = 5

[general]
live_config_reload = true
import = [
    "./themes/gruvbox_dark.toml"
]
