##Version 0.2.0
##Enable mouse support: click to select panes/windows, scroll, resize panes.
set -g mouse on
#
##Number of lines to keep in scrollback buffer per pane.
set -g history-limit 20000
#
##Starting index for window numbers
set -g base-index 1
#
##Starting index for pane numbers within windows.
setw -g pane-base-index 1
#
## Start new Windows and Panes current path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
#
# Resource config file
bind r source-file ~/.tmux.conf \; display "Reloaded!"
#                             
set-option -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*256col*:Tc"
#
#                              
## List of plugins (add more below)
#set -g @plugin 'tmux-plugins/tpm'
#set -g @plugin 'tmux-plugins/tmux-sensible'
##set -g @plugin 'christoomey/vim-tmux-navigator'


## Status bar
set -g status-position top
set -g status-interval 5
set -g status on

# ── Gruvbox Dark Palette ─────────────────────
# Status bar
set -g status-style "bg=#282828,fg=#a89984"
set -g status-left-length 40
set -g status-right-length 80

# Left section
set -g status-left "#[fg=#282828,bg=#d79921,bold] #S #[fg=#d79921,bg=#3c3836]"
set -ga status-left "#[fg=#ffffff,bold,bg=#3c3836] KARAKARTAL "

# Window tabs
setw -g window-status-format "#[fg=#928374,bg=#4a4a4a] #I - #W "
setw -g window-status-current-format "#[fg=#282828,bg=#a9b665,bold] #I - #W "


setw -g window-status-current-style "bg=#a9b665,fg=#282828,bold"


# Window separators
setw -g window-status-separator " "

# Right section
set -g status-right "#[fg=#504945]#[fg=#d79921,bg=#504945,bold] %d %b #[fg=#a89984,bg=#504945] %H:%M "

# Message styling
set -g message-style "bg=#d79921,fg=#282828,bold"
set -g message-command-style "bg=#3c3836,fg=#ebdbb2"

# Pane borders
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#d79921"

# Clock
setw -g clock-mode-colour "#d79921"
setw -g clock-mode-style 24

## Window separator
#
## Right side
#set -g status-right "#[fg=#a9b1d6]󰥔 %d-%m-%Y %H:%M "
#
## Pane borders
#set -g pane-border-style "fg=#FFFFFF,bold"
#set -g pane-active-border-style "fg=#eb4034"
#
## Messages
#set -g message-style "bg=#1a1d24,fg=#c0caf5,bold"
#set -g message-command-style "bg=#1a1d24,fg=#c0caf5"
#
## Mode
set -g mode-style "bg=#7aa2f7,fg=#111318,bold"
#

## Automatic window naming
set -g renumber-windows on
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_command}"
#
## Allow manual renaming
set -g allow-rename on
