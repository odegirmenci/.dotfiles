#"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#171717)\
$os\
$username\
[](bg:#303030 fg:#171717)\
$time\
[](fg:#303030 bg:#4A4A4A)\
$directory\
[](fg:#4A4A4A bg:#666666)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$maven\
$nodejs\
$bun\
$nim\
$rust\
$scala\
[](fg:#666666 bg:#858585)\
$docker_context\
[](fg:#858585 bg:#D4D4D4)\
$git_branch\
$git_status\
[ ](fg:#D4D4D4)\
"""

# Disable the blank line at the start of the prompt
add_newline = true

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:#171717"
style_root = "bg:#171717"
format = '[$user ]($style)'
disabled = false 

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#171717"
disabled = true# Disabled by default

[directory]
style = "bg:#4A4A4A"
format = "[ $path ]($style)"
#truncation_length = 5
#truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:#666666"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:#666666"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "fg:#111111 bg:#858585"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#666666"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#666666"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "fg:#111111 bg:#D4D4D4"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:#111111 bg:#D4D4D4"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#666666"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#666666"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#666666"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#666666"
format = '[ $symbol ($version) ]($style)'

[jj_bookmark]
symbol = ""
style = "bg:#4A4A4A"
format = '[ $symbol $bookmark(@$remote)$diverged( \\(+$overflow_count others\\)) ]($style)'

[jj_status]
style = "bg:#4A4A4A"
format = '[$all ]($style)'

[julia]
symbol = " "
style = "bg:#666666"
format = '[ $symbol ($version) ]($style)'

[maven]
style = "bg:#666666"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#666666"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "bg:#666666"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:#666666"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#666666"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#666666"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#303030"
format = '[ $time ]($style)'

